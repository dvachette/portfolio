services:
  portfolio:
    build: ./portfolio
    ports:
      - "127.0.0.1:3001:80"
    restart: unless-stopped
    volumes:
      - ./portfolio-images/projects:/usr/local/apache2/htdocs/images/projects

  portfolio-backend:
    build: ./portfolio-backend
    ports:
      - "127.0.0.1:3003:3000"
    restart: unless-stopped
    env_file:
      - ./portfolio-backend/.env
    volumes:
      - ./portfolio-backend/data:/app/data